# Custom Falco rules for the worked examples' agent sandboxes.
# Loaded after Falco's default rules, so default macros (e.g. open_write) are available.

- macro: agent_sandbox
  condition: container.image.repository = "lab/agent-sandbox"

- rule: Outbound connection from agent sandbox
  desc: A process in an agent sandbox container connected to another host.
  condition: >
    evt.type = connect and agent_sandbox
    and fd.typechar = 4
    and not fd.snet in ("127.0.0.0/8")
  output: >
    Outbound connection from agent sandbox
    (connection=%fd.name command=%proc.cmdline process=%proc.name parent=%proc.pname
    user=%user.name container_id=%container.id container_name=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: NOTICE
  tags: [agent_sandbox, network, container]

- rule: Write to host-mounted path from agent sandbox
  desc: A process in an agent sandbox container wrote to a path mounted from the host.
  condition: >
    open_write and agent_sandbox
    and (fd.name startswith /output/ or fd.name startswith /mnt/)
  output: >
    Write to host-mounted path from agent sandbox
    (file=%fd.name command=%proc.cmdline process=%proc.name parent=%proc.pname
    user=%user.name container_id=%container.id container_name=%container.name
    image=%container.image.repository:%container.image.tag)
  priority: NOTICE
  tags: [agent_sandbox, filesystem, container]
