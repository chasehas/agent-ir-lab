# Status-report jobs: may reach internal services and write reports to the shared output folder.
services:
  default:
    image: lab/agent-sandbox:1
    init: true
    command: tail -f /dev/null
    working_dir: /work
    volumes:
      - ${AGENT_OUTPUT_DIR:-/srv/agent-output}:/output
    networks:
      - lab

networks:
  lab:
    external: true
